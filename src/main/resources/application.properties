
# ==========================================
# MINIPEDIDOS V2 - CONFIGURACION GENERAL
# ==========================================

spring.application.name=minipedidos-kafka
server.port=8080


# ==========================================
# GITHUB CODESPACES
# ==========================================

# Reconocer cabeceras de proxy HTTPS
server.forward-headers-strategy=framework


# ==========================================
# APACHE KAFKA
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092


# ==========================================
# SESION 2 - PRODUCTOR KAFKA
# ==========================================

# Serializacion de la clave
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Serializacion del mensaje
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Confirmacion de mensajes
spring.kafka.producer.acks=all


# ==========================================
# SESION 4 - CONSUMIDOR KAFKA
# ==========================================

# Convertir la clave recibida en texto
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Convertir el mensaje recibido en texto
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Grupo de consumidores
spring.kafka.consumer.group-id=minipedidos-consumidores

# Leer desde el comienzo solamente cuando
# el grupo no tenga offsets previamente guardados
spring.kafka.consumer.auto-offset-reset=earliest


# ==========================================
# SESION 3 - PARTE 3
# BASE DE DATOS H2 PERSISTENTE
# ==========================================

# Almacenamiento en archivos
spring.datasource.url=jdbc:h2:file:./data/minipedidos-usuarios

# Controlador JDBC
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales provisionales del laboratorio
spring.datasource.username=sa
spring.datasource.password=


# ==========================================
# INICIALIZACION DE TABLAS
# ==========================================

# Ejecutar schema.sql al iniciar Spring Boot
spring.sql.init.mode=always

# Archivo con tablas de usuarios y roles
spring.sql.init.schema-locations=classpath:schema.sql

# Detener inicio si falla la inicializacion
spring.sql.init.continue-on-error=false


# ==========================================
# SEGURIDAD DE SESIONES WEB
# ==========================================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Tiempo de inactividad permitido
server.servlet.session.timeout=30m
